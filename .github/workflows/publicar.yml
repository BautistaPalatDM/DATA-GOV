# Publica la carpeta app/ en GitHub Pages cada vez que hay un cambio en main.
# Antes de la primera vez: Settings → Pages → Source: "GitHub Actions" (ver README, paso 3).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar la carpeta app/
        uses: actions/upload-pages-artifact@v4
        with:
          path: app

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
